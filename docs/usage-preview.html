<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dsh-tools 今日 Token 用量 — 预览</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root { --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  body { background:#0b0b0c; min-height:100vh; display:flex; align-items:center; justify-content:center; gap:44px; padding:40px;
         font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
  .stage { display:flex; flex-direction:column; gap:14px; align-items:center; }
  .caption { font-size:11px; color:#78787f; letter-spacing:.08em; }
  .theme-light { --bg-layer-1:#f7f7f8; --bg-overlay:#ffffff; --label-primary:#1f1f21; --label-secondary:#5c5c63;
                 --label-tertiary:#8a8a90; --interactive-hover:rgba(0,0,0,.06); --brand:#3b82f6; --border:rgba(0,0,0,.10); }
  .theme-dark  { --bg-layer-1:#171718; --bg-overlay:#242428; --label-primary:#f2f2f2; --label-secondary:#a8a8ad;
                 --label-tertiary:#78787f; --interactive-hover:rgba(255,255,255,.09); --brand:#3b82f6; --border:rgba(255,255,255,.12); }
  .sidebar-wrap { position:relative; }
  .sidebar { width:232px; background:var(--bg-layer-1); border-radius:14px; padding:14px 12px; display:flex; flex-direction:column; gap:10px; min-height:420px; color:var(--label-primary); }
  .fake-row { height:30px; border-radius:8px; background:color-mix(in srgb,var(--label-primary) 4%,transparent); }
  .footArea { margin-top:auto; display:flex; flex-direction:column; gap:8px; }
  .footerActions { display:flex; }
  .settingsArea { display:flex; align-items:center; gap:8px; height:34px; border-radius:8px; padding:0 6px; background:color-mix(in srgb,var(--label-primary) 2%,transparent); }
  .avatar { width:22px; height:22px; border-radius:50%; background:linear-gradient(135deg,#5b8def,#9b6bff); }
  .settingsArea span { font-size:12px; color:var(--label-secondary); }

  /* popover — mirrors client.js USAGE_CSS (theme-adaptive vars) */
  .dsh-tools-usagePop { --u-line:var(--border); --u-fill:rgba(128,128,128,.07); --u-fill:color-mix(in srgb,var(--label-primary) 7%,transparent);
    --u-bar:rgba(128,128,128,.32); --u-bar:color-mix(in srgb,var(--label-primary) 26%,transparent);
    --u-in:#0284c7; --u-out:#d97706; --u-cr:var(--brand); --u-cw:#7c3aed;
    position:absolute; left:246px; bottom:64px; width:280px; padding:16px 16px 12px; border-radius:14px;
    background:var(--bg-overlay); border:1px solid var(--u-line); box-shadow:0 12px 32px rgba(15,17,23,.16),0 2px 6px rgba(15,17,23,.08);
    color:var(--label-primary); font-size:12.5px; animation:pop .18s cubic-bezier(.16,1,.3,1); }
  @keyframes pop { from { opacity:0; transform:translateY(6px) scale(.98); } to { opacity:1; transform:none; } }
  .dsh-tools-usageEyebrow { margin-bottom:5px; font-size:10.5px; font-weight:600; letter-spacing:.06em; color:var(--label-tertiary); }
  .dsh-tools-usageHead { display:flex; align-items:flex-end; justify-content:space-between; gap:10px; }
  .dsh-tools-usageTotal { font-family:var(--mono); font-size:24px; line-height:1.05; font-weight:600; font-variant-numeric:tabular-nums; }
  .dsh-tools-usageDelta { display:inline-flex; align-items:center; height:20px; padding:0 8px; border-radius:999px; font-size:10.5px; font-weight:600;
    background:rgba(128,128,128,.12); background:color-mix(in srgb,currentColor 11%,transparent); }
  .dsh-tools-usageDelta.is-up { color:#dc2626; }
  .dsh-tools-usageDelta.is-down { color:#16a34a; }
  .dsh-tools-usageComp { display:flex; gap:2px; height:8px; margin:14px 0 4px; }
  .dsh-tools-usageCompSeg { flex:none; min-width:0; border-radius:999px; }
  .dsh-tools-usageBuckets { display:flex; flex-direction:column; gap:1px; }
  .dsh-tools-usageBucketRow { display:flex; align-items:center; gap:8px; height:24px; padding:0 6px; margin:0 -6px; border-radius:7px; }
  .dsh-tools-usageBucketRow:hover { background:var(--interactive-hover); }
  .dsh-tools-usageDot { width:8px; height:8px; border-radius:3px; flex:none; }
  .dsh-tools-usageBucketName { flex:1; color:var(--label-secondary); font-size:12px; }
  .dsh-tools-usageBucketValue { flex:none; font-family:var(--mono); font-size:12px; font-variant-numeric:tabular-nums; }
  .dsh-tools-usageBucketShare { width:44px; flex:none; text-align:right; color:var(--label-tertiary); font-size:11px; font-variant-numeric:tabular-nums; }
  .dsh-tools-usageStats { display:flex; gap:8px; margin-top:12px; }
  .dsh-tools-usageStat { flex:1; padding:8px 10px; border-radius:10px; background:var(--u-fill); }
  .dsh-tools-usageStatValue { font-family:var(--mono); font-size:14px; font-weight:600; font-variant-numeric:tabular-nums; }
  .dsh-tools-usageStatLabel { margin-top:1px; font-size:10.5px; color:var(--label-tertiary); }
  .dsh-tools-usageChartTitle { margin:14px 0 7px; font-size:10.5px; font-weight:600; letter-spacing:.06em; color:var(--label-tertiary); }
  .dsh-tools-usageChartRow { position:relative; display:flex; align-items:flex-end; gap:6px; height:44px; padding-bottom:5px; border-bottom:1px solid var(--u-line); }
  .dsh-tools-usageCol { flex:1; display:flex; align-items:flex-end; justify-content:center; height:100%; }
  .dsh-tools-usageColBar { width:100%; max-width:18px; min-height:3px; border-radius:4px 4px 2px 2px; background:var(--u-bar); }
  .dsh-tools-usageCol.is-today .dsh-tools-usageColBar { background:var(--brand); box-shadow:0 0 10px rgba(59,130,246,.35); }
  .dsh-tools-usageChartTags { display:flex; gap:6px; margin-top:4px; }
  .dsh-tools-usageColTag { flex:1; text-align:center; font-size:9.5px; line-height:1; color:var(--label-tertiary); }
  .dsh-tools-usageColTag.is-today { color:var(--label-secondary); font-weight:600; }
  .dsh-tools-usageFoot { display:flex; align-items:center; gap:6px; margin-top:12px; padding-top:9px; border-top:1px solid var(--u-line); color:var(--label-tertiary); font-size:11px; }
  .dsh-tools-usageStamp { flex:1; font-family:var(--mono); }
  .dsh-tools-usageRefresh { all:unset; display:inline-flex; align-items:center; justify-content:center; width:24px; height:24px; border-radius:6px; color:var(--label-secondary); }
  .dsh-tools-usageRefresh:hover { background:var(--interactive-hover); color:var(--label-primary); }

  .sidebar button.chip { all:unset; display:inline-flex; align-items:center; gap:6px; height:28px; padding:0 9px; margin:0 0 4px 8px;
    border-radius:8px; color:var(--label-secondary); font-size:12px; }
  .sidebar button.chip:hover { background:var(--interactive-hover); color:var(--label-primary); }
  .chip svg { color:var(--label-tertiary); }
  .chip .v { font-family:var(--mono); font-size:11.5px; color:var(--label-primary); }
</style>
</head>

        </div>
